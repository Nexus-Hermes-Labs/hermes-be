syntax = "proto3";

package user.v1;

// =====================================================
// USER SERVICE
// =====================================================

service UserService {
  // Discriminator operations (for Auth Service)
  rpc GenerateDiscriminator(GenerateDiscriminatorRequest)
      returns (GenerateDiscriminatorResponse);

  rpc CheckUsernameAvailability(CheckUsernameAvailabilityRequest)
      returns (CheckUsernameAvailabilityResponse);

  // User queries (for Auth Service during registration/login)
  rpc GetUserById(GetUserByIdRequest)
      returns (GetUserByIdResponse);

  rpc GetUserByEmail(GetUserByEmailRequest)
      returns (GetUserByEmailResponse);

  // Friendship checks (for privacy validation)
  rpc AreFriends(AreFriendsRequest)
      returns (AreFriendsResponse);

  rpc IsBlocked(IsBlockedRequest)
      returns (IsBlockedResponse);
}

// =====================================================
// DISCRIMINATOR MESSAGES
// =====================================================

message GenerateDiscriminatorRequest {
  string username = 1;
}

message GenerateDiscriminatorResponse {
  string discriminator = 1;  // e.g., "0001", "0042"
}

message CheckUsernameAvailabilityRequest {
  string username = 1;
  string discriminator = 2;
}

message CheckUsernameAvailabilityResponse {
  bool available = 1;
}

// =====================================================
// USER QUERY MESSAGES
// =====================================================

message GetUserByIdRequest {
  string user_id = 1;  // UUID as string
}

message GetUserByIdResponse {
  optional User user = 1;
}

message GetUserByEmailRequest {
  string email = 1;
}

message GetUserByEmailResponse {
  optional User user = 1;
}

// =====================================================
// RELATIONSHIP MESSAGES
// =====================================================

message AreFriendsRequest {
  string user_id = 1;
  string other_user_id = 2;
}

message AreFriendsResponse {
  bool are_friends = 1;
}

message IsBlockedRequest {
  string blocker_id = 1;
  string blocked_id = 2;
}

message IsBlockedResponse {
  bool is_blocked = 1;
}

// =====================================================
// COMMON TYPES
// =====================================================

message User {
  string id = 1;
  string username = 2;
  string discriminator = 3;
  string email = 4;
  string display_name = 5;

  optional string bio = 6;
  optional string avatar_url = 7;
  optional string banner_url = 8;

  string status = 9;  // "online", "offline", "idle", "dnd"

  optional CustomStatus custom_status = 10;

  PrivacySettings privacy_settings = 11;

  string role = 12;  // "user", "moderator", "admin"

  bool is_active = 13;
  bool email_verified = 14;

  string created_at = 15;  // ISO 8601
  string updated_at = 16;  // ISO 8601
}

message CustomStatus {
  optional string text = 1;
  optional string emoji = 2;
  optional string expires_at = 3;  // ISO 8601
}

message PrivacySettings {
  string allow_dms_from = 1;  // "everyone", "friends", "server_members", "none"
  string allow_friend_requests_from = 2;  // "everyone", "friends_of_friends", "none"
  bool show_online_status = 3;
}