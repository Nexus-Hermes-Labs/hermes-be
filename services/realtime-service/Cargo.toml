# Realtime Service - Cargo.toml
# Handles WebSocket connections, NATS event fanout, and connection state

[package]
name = "realtime-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "realtime-service"
path = "src/main.rs"

[dependencies]
# ============================================================================
# LOCAL DEPENDENCIES
# ============================================================================
common = { path = "../common" }

# ============================================================================
# WEB FRAMEWORK
# ============================================================================
axum = { workspace = true }
axum-extra = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# ============================================================================
# SERIALIZATION
# ============================================================================
serde = { workspace = true }
serde_json = { workspace = true }

# ============================================================================
# ERROR HANDLING
# ============================================================================
thiserror = { workspace = true }
anyhow = { workspace = true }

# ============================================================================
# ASYNC UTILITIES
# ============================================================================
async-trait = { workspace = true }
futures = { workspace = true }

# ============================================================================
# CONFIGURATION
# ============================================================================
config = { workspace = true }
dotenvy = { workspace = true }

# ============================================================================
# LOGGING & OBSERVABILITY
# ============================================================================
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# ============================================================================
# METRICS
# ============================================================================
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# ============================================================================
# TIME & UUID
# ============================================================================
uuid = { workspace = true }
chrono = { workspace = true }

# ============================================================================
# REDIS (for connection state)
# ============================================================================
redis = { workspace = true }

# ============================================================================
# NATS (subscribe to events and broadcast to WebSocket clients)
# ============================================================================
async-nats = { workspace = true }

# ============================================================================
# WEBSOCKET
# ============================================================================
tokio-tungstenite = { workspace = true }

# ============================================================================
# TESTING
# ============================================================================
[dev-dependencies]
mockall = { workspace = true }
fake = { workspace = true }
rstest = { workspace = true }

# ============================================================================
# FEATURES
# ============================================================================
[features]
default = []

# ============================================================================
# NOTES
# ============================================================================
# - NO PostgreSQL (stateless service)
# - WebSocket connections for real-time events
# - Subscribes to NATS events and broadcasts to connected clients
# - Connection state tracked in Redis
# - nginx handles REST routing, TLS, rate limiting
