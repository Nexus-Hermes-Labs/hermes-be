# Common Crate - Cargo.toml
# This file now defines a workspace for all common crates.

[package]
name = "common"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# ============================================================================
# LOCAL DEPENDENCIES
# ============================================================================
common-config = { path = "common-config" }

# ============================================================================
# WEB FRAMEWORK
# ============================================================================
axum = { workspace = true }
axum-extra = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# ============================================================================
# GRPC
# ============================================================================
tonic = { workspace = true }
prost = { workspace = true }

# ============================================================================
# AUTHENTICATION & SECURITY (Auth-specific)
# ============================================================================
argon2 = { workspace = true }       # Password hashing
jsonwebtoken = { workspace = true } # JWT generation
rand = { workspace = true }         # Token secrets

# ============================================================================
# SERIALIZATION & VALIDATION
# ============================================================================
serde = { workspace = true }
serde_json = { workspace = true }
validator = { workspace = true }

# ============================================================================
# ERROR HANDLING
# ============================================================================
anyhow = { workspace = true }
thiserror = { workspace = true }

# ============================================================================
# METRICS (Prometheus)
# ============================================================================
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# ============================================================================
# ASYNC
# ============================================================================
async-trait = { workspace = true }

# ============================================================================
# DATABASE (for models and utilities)
# ============================================================================
sqlx = { workspace = true }

# ============================================================================
# TIME & UUID (for models)
# ============================================================================
uuid = { workspace = true }
chrono = { workspace = true }

# ============================================================================
# REDIS (wrapper utilities)
# ============================================================================
redis = { workspace = true }

# ============================================================================
# NATS (event types and publisher)
# ============================================================================
async-nats = { workspace =true }

# ============================================================================
# LOGGING & OBSERVABILITY
# ============================================================================
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# ============================================================================
# TESTING
# ============================================================================
[dev-dependencies]
mockall = { workspace = true }
fake = { workspace = true }
rstest = { workspace = true }
tokio-test = "0.4"

# ============================================================================
# FEATURES
# ============================================================================
[features]
default = []
# Future features if needed

[build-dependencies]
tonic-build = { workspace = true }