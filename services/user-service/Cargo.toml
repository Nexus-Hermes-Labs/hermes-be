# User Service - Cargo.toml
# Handles user_profile profiles, friendships, and blocking

[package]
name = "user-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "user-service"
path = "src/main.rs"


[dependencies]
# ============================================================================
# LOCAL DEPENDENCIES
# ============================================================================
common = { path = "../common" }

# ============================================================================
# WEB FRAMEWORK
# ============================================================================
axum = { workspace = true }
axum-extra = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# ============================================================================
# GRPC (Inter-service Communication)
# ============================================================================
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }

# ============================================================================
# DATABASE
# ============================================================================
sqlx = { workspace = true }

# ============================================================================
# SERIALIZATION & VALIDATION
# ============================================================================
serde = { workspace = true }
serde_json = { workspace = true }
validator = { workspace = true }

# ============================================================================
# ERROR HANDLING
# ============================================================================
thiserror = { workspace = true }
anyhow = { workspace = true }

# ============================================================================
# AUTHENTICATION & SECURITY (Auth-specific)
# ============================================================================
argon2 = { workspace = true }       # Password hashing
jsonwebtoken = { workspace = true } # JWT generation
rand = { workspace = true }         # Token secrets

# ============================================================================
# CONFIGURATION
# ============================================================================
config = { workspace = true }
dotenvy = { workspace = true }

# ============================================================================
# LOGGING & OBSERVABILITY
# ============================================================================
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# ============================================================================
# METRICS
# ============================================================================
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# ============================================================================
# TIME & UUID
# ============================================================================
uuid = { workspace = true }
chrono = { workspace = true }

# ============================================================================
# REDIS (for refresh tokens)
# ============================================================================
redis = { workspace = true }

# ============================================================================
# ASYNC
# ============================================================================
async-trait = { workspace = true }

# ============================================================================
# NATS (for publishing user_profile.created events)
# ============================================================================
async-nats = { workspace = true }

# ============================================================================
# API DOCUMENTATION
# ============================================================================
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
lazy_static = "1.5.0"
regex = { workspace = true }
once_cell = { workspace = true }

# ============================================================================
# TESTING
# ============================================================================
[dev-dependencies]
mockall = { workspace = true }
fake = { workspace = true }
rstest = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }

# ============================================================================
# BUILD DEPENDENCIES (proto compilation)
# ============================================================================
[build-dependencies]
tonic-build = { workspace = true }

# ============================================================================
# FEATURES
# ============================================================================
[features]
default = []
# Future: Add feature flags if needed (e.g., "oauth", "2fa")
