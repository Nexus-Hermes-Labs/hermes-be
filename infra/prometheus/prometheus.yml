global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Scrape application services on their HTTP port. The `/metrics` route is
# mounted outside the trace_layer so scrape requests don't pollute
# `http_requests_total` or generate request-id spans.
scrape_configs:
  - job_name: 'auth-service'
    static_configs:
      - targets: ['hermes-auth-service:8081']
    metrics_path: '/metrics'

  - job_name: 'user-service'
    static_configs:
      - targets: ['hermes-user-service:8082']
    metrics_path: '/metrics'

  - job_name: 'channel-service'
    static_configs:
      - targets: ['hermes-channel-service:8083']
    metrics_path: '/metrics'

  - job_name: 'messaging-service'
    static_configs:
      - targets: ['hermes-messaging-service:8084']
    metrics_path: '/metrics'

  - job_name: 'guild-service'
    static_configs:
      - targets: ['hermes-guild-service:8086']
    metrics_path: '/metrics'

  - job_name: 'realtime-service'
    static_configs:
      - targets: ['hermes-realtime-service:8092']
    metrics_path: '/metrics'

  - job_name: 'chat-service'
    static_configs:
      - targets: ['hermes-chat-service:8094']
    metrics_path: '/metrics'
