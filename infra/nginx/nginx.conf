# Hermes API Gateway — nginx reverse proxy
#
# Routes all /api/v1/* traffic to the appropriate microservice.
# Rust services run on the host; nginx reaches them via host.docker.internal.
#
# Service ports (host):
#   auth-service    → 8081
#   user-service    → 8082
#   channel-service → 8083
#   guild-service   → 8086
#
# IMPORTANT: channel-service handles /guilds/:id/channels routes in addition to
# /channels/:id. The regex location below gives it priority over the guild
# prefix location for that sub-path.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ── Upstreams ─────────────────────────────────────────────────────────────
    upstream auth_service {
        server host.docker.internal:8081;
    }

    upstream user_service {
        server host.docker.internal:8082;
    }

    upstream guild_service {
        server host.docker.internal:8086;
    }

    upstream channel_service {
        server host.docker.internal:8083;
    }

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Server ────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Propagate client info to upstream services
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # ── Auth service — /api/v1/auth/* ──────────────────────────────────
        location /api/v1/auth/ {
            proxy_pass http://auth_service;
        }

        # ── User service — /api/v1/users/* ────────────────────────────────
        location /api/v1/users/ {
            proxy_pass http://user_service;
        }

        # ── Channel service — /api/v1/guilds/:id/channels[/*] ─────────────
        # Regex location takes priority over the /api/v1/guilds/ prefix below.
        location ~ ^/api/v1/guilds/[^/]+/channels(/.*)?$ {
            proxy_pass http://channel_service;
        }

        # ── Channel service — /api/v1/channels/* ──────────────────────────
        location /api/v1/channels/ {
            proxy_pass http://channel_service;
        }

        # ── Guild service — /api/v1/guilds/* ──────────────────────────────
        # Catches guild CRUD, members, roles, and invite management.
        location /api/v1/guilds/ {
            proxy_pass http://guild_service;
        }

        # ── Guild service — /api/v1/invites/* ─────────────────────────────
        # Public invite preview (GET /invites/:code) and invite use (POST /invites/:code/use).
        location /api/v1/invites/ {
            proxy_pass http://guild_service;
        }

        # ── Gateway health check ───────────────────────────────────────────
        location /health {
            access_log off;
            return 200 "hermes-gateway OK\n";
            add_header Content-Type text/plain;
        }
    }
}
