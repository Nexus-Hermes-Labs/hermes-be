services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: hermes-postgres
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
      POSTGRES_DB: hermes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - hermes-network

  # Redis Cache & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: hermes-redis
    command: redis-server --appendonly yes --requirepass redis_dev_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_dev_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hermes-network

  # NATS Message Broker (JetStream enabled)
  nats:
    image: nats:2.10-alpine
    container_name: hermes-nats
    command: "-js --store_dir=/data -m 8222"
    ports:
      - "4222:4222" # Client connections
      - "8222:8222" # HTTP monitoring
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hermes-network

  # Prometheus Metrics
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: hermes-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - hermes-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:11.2.0
    container_name: hermes-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hermes-network

  # Mailpit Email Catcher
  mailpit:
    image: axllent/mailpit:latest
    container_name: hermes-mailpit
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    networks:
      - hermes-network

  # ─── Rust Microservices ────────────────────────────────────────────────────

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth-service
    container_name: hermes-auth-service
    restart: unless-stopped
    env_file: .env
    environment:
      APP_SERVICE__NAME: auth-service
      APP_SERVICE__VERSION: "1.0.0"
      APP_SERVICE__HOST: "0.0.0.0"
      APP_SERVICE__PORT: "8081"
      APP_SERVICE__GRPC_PORT: "50051"
      APP_SERVICE__ENVIRONMENT: development
      APP_DATABASE__HOST: hermes-postgres
      APP_REDIS__HOST: hermes-redis
      APP_NATS__SERVERS: hermes-nats:4222
      APP_SMTP__HOST: hermes-mailpit
      APP_GRPC_ENDPOINTS__USER_SERVICE: http://hermes-user-service:50052
    ports:
      - "8081:8081"
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - hermes-network

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: user-service
    container_name: hermes-user-service
    restart: unless-stopped
    env_file: .env
    environment:
      APP_SERVICE__NAME: user-service
      APP_SERVICE__VERSION: "1.0.0"
      APP_SERVICE__HOST: "0.0.0.0"
      APP_SERVICE__PORT: "8082"
      APP_SERVICE__GRPC_PORT: "50052"
      APP_SERVICE__ENVIRONMENT: development
      APP_DATABASE__HOST: hermes-postgres
      APP_REDIS__HOST: hermes-redis
      APP_NATS__SERVERS: hermes-nats:4222
      APP_SMTP__HOST: hermes-mailpit
      APP_GRPC_ENDPOINTS__AUTH_SERVICE: http://hermes-auth-service:50051
    ports:
      - "8082:8082"
      - "50052:50052"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - hermes-network

  channel-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: channel-service
    container_name: hermes-channel-service
    restart: unless-stopped
    env_file: .env
    environment:
      APP_SERVICE__NAME: channel-service
      APP_SERVICE__VERSION: "1.0.0"
      APP_SERVICE__HOST: "0.0.0.0"
      APP_SERVICE__PORT: "8083"
      APP_SERVICE__GRPC_PORT: "50053"
      APP_SERVICE__ENVIRONMENT: development
      APP_DATABASE__HOST: hermes-postgres
      APP_REDIS__HOST: hermes-redis
      APP_NATS__SERVERS: hermes-nats:4222
      APP_SMTP__HOST: hermes-mailpit
      APP_GRPC_ENDPOINTS__GUILD_SERVICE: http://hermes-guild-service:50056
    ports:
      - "8083:8083"
      - "50053:50053"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - hermes-network

  guild-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: guild-service
    container_name: hermes-guild-service
    restart: unless-stopped
    env_file: .env
    environment:
      APP_SERVICE__NAME: guild-service
      APP_SERVICE__VERSION: "1.0.0"
      APP_SERVICE__HOST: "0.0.0.0"
      APP_SERVICE__PORT: "8086"
      APP_SERVICE__GRPC_PORT: "50056"
      APP_SERVICE__ENVIRONMENT: development
      APP_DATABASE__HOST: hermes-postgres
      APP_REDIS__HOST: hermes-redis
      APP_NATS__SERVERS: hermes-nats:4222
      APP_SMTP__HOST: hermes-mailpit
      APP_GRPC_ENDPOINTS__USER_SERVICE: http://hermes-user-service:50052
      APP_GRPC_ENDPOINTS__CHANNEL_SERVICE: http://hermes-channel-service:50053
    ports:
      - "8086:8086"
      - "50056:50056"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - hermes-network

  # ─── Stub services (traefik/whoami placeholder until implemented) ───────────

  chat-service:
    image: traefik/whoami
    container_name: hermes-chat-service
    restart: unless-stopped
    command: --port=8084
    networks:
      - hermes-network

  messaging-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: messaging-service
    container_name: hermes-messaging-service
    restart: unless-stopped
    env_file: .env
    environment:
      APP_SERVICE__NAME: messaging-service
      APP_SERVICE__VERSION: "1.0.0"
      APP_SERVICE__HOST: "0.0.0.0"
      APP_SERVICE__PORT: "8084"
      APP_SERVICE__GRPC_PORT: "50054"
      APP_SERVICE__ENVIRONMENT: development
      APP_DATABASE__HOST: hermes-postgres
      APP_REDIS__HOST: hermes-redis
      APP_NATS__SERVERS: hermes-nats:4222
      APP_SMTP__HOST: hermes-mailpit
    ports:
      - "8084:8084"
      - "50054:50054"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - hermes-network

  voice-service:
    image: traefik/whoami
    container_name: hermes-voice-service
    restart: unless-stopped
    command: --port=8085
    networks:
      - hermes-network

  presence-service:
    image: traefik/whoami
    container_name: hermes-presence-service
    restart: unless-stopped
    command: --port=8087
    networks:
      - hermes-network

  realtime-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: realtime-service
    container_name: hermes-realtime-service
    restart: unless-stopped
    env_file: .env
    environment:
      APP_SERVICE__NAME: realtime-service
      APP_SERVICE__VERSION: "1.0.0"
      APP_SERVICE__HOST: "0.0.0.0"
      APP_SERVICE__PORT: "8092"
      APP_SERVICE__ENVIRONMENT: development
      APP_DATABASE__HOST: hermes-postgres
      APP_REDIS__HOST: hermes-redis
      APP_NATS__SERVERS: hermes-nats:4222
      APP_SMTP__HOST: hermes-mailpit
    ports:
      - "8092:8092"
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - hermes-network

  media-service:
    image: traefik/whoami
    container_name: hermes-media-service
    restart: unless-stopped
    command: --port=8088
    networks:
      - hermes-network

  notification-service:
    image: traefik/whoami
    container_name: hermes-notification-service
    restart: unless-stopped
    command: --port=8089
    networks:
      - hermes-network

  search-service:
    image: traefik/whoami
    container_name: hermes-search-service
    restart: unless-stopped
    command: --port=8090
    networks:
      - hermes-network

  ai-service:
    image: traefik/whoami
    container_name: hermes-ai-service
    restart: unless-stopped
    command: --port=8091
    networks:
      - hermes-network

  # ─── API Testing ───────────────────────────────────────────────────────────

  # Schemathesis API Tester (only starts with: --profile testing)
  schemathesis:
    image: schemathesis/schemathesis:stable
    container_name: hermes-schemathesis
    profiles:
      - testing
    environment:
      AUTH_URL: "${AUTH_URL:-http://hermes-auth-service:8081}"
      USER_URL: "${USER_URL:-http://hermes-user-service:8082}"
      GUILD_URL: "${GUILD_URL:-http://hermes-guild-service:8086}"
    volumes:
      - ./reports:/reports
    networks:
      - hermes-network

volumes:
  postgres_data:
  redis_data:
  nats_data:
  prometheus_data:
  grafana_data:

networks:
  hermes-network:
    external: true
