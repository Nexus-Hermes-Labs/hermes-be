services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: hermes-postgres
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
      POSTGRES_DB: hermes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - hermes-network

  # Redis Cache & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: hermes-redis
    command: redis-server --appendonly yes --requirepass redis_dev_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_dev_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hermes-network

  # NATS Message Broker (JetStream enabled)
  nats:
    image: nats:2.10-alpine
    container_name: hermes-nats
    command: "-js --store_dir=/data -m 8222"
    ports:
      - "4222:4222" # Client connections
      - "8222:8222" # HTTP monitoring
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hermes-network

  # Prometheus Metrics
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: hermes-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - hermes-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:11.2.0
    container_name: hermes-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hermes-network

  # Mailpit Email Catcher
  mailpit:
    image: axllent/mailpit:latest
    container_name: hermes-mailpit
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    networks:
      - hermes-network

  # Schemathesis API Tester (only starts with: --profile testing)
  schemathesis:
    image: schemathesis/schemathesis:stable
    container_name: hermes-schemathesis
    profiles:
      - testing
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AUTH_URL: "${AUTH_URL:-http://host.docker.internal:8081}"
      USER_URL: "${USER_URL:-http://host.docker.internal:8082}"
      GUILD_URL: "${GUILD_URL:-http://host.docker.internal:8086}"
    volumes:
      - ./reports:/reports
    networks:
      - hermes-network

volumes:
  postgres_data:
  redis_data:
  nats_data:
  prometheus_data:
  grafana_data:

networks:
  hermes-network:
    name: hermes-network
    driver: bridge
