# Gateway Service - Cargo.toml
# Handles WebSocket connections, API proxying, and event broadcasting

[package]
name = "gateway-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "gateway-service"
path = "src/main.rs"

[dependencies]
# ============================================================================
# LOCAL DEPENDENCIES
# ============================================================================
common = { path = "../common" }

# ============================================================================
# WEB FRAMEWORK
# ============================================================================
axum = { workspace = true }
axum-extra = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# ============================================================================
# SERIALIZATION
# ============================================================================
serde = { workspace = true }
serde_json = { workspace = true }

# ============================================================================
# ERROR HANDLING
# ============================================================================
thiserror = { workspace = true }
anyhow = { workspace = true }

# ============================================================================
# ASYNC UTILITIES
# ============================================================================
async-trait = { workspace = true }
futures = { workspace = true }

# ============================================================================
# CONFIGURATION
# ============================================================================
config = { workspace = true }
dotenvy = { workspace = true }

# ============================================================================
# LOGGING & OBSERVABILITY
# ============================================================================
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# ============================================================================
# METRICS
# ============================================================================
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# ============================================================================
# TIME & UUID
# ============================================================================
uuid = { workspace = true }
chrono = { workspace = true }

# ============================================================================
# HTTP CLIENT (for proxying requests to backend services)
# ============================================================================
reqwest = { workspace = true }

# ============================================================================
# REDIS (for connection state and rate limiting)
# ============================================================================
redis = { workspace = true }

# ============================================================================
# NATS (subscribe to ALL events and broadcast to WebSocket clients)
# ============================================================================
async-nats = { workspace = true }

# ============================================================================
# WEBSOCKET
# ============================================================================
tokio-tungstenite = { workspace = true }

# ============================================================================
# RATE LIMITING
# ============================================================================
governor = { workspace = true }

# ============================================================================
# API DOCUMENTATION
# ============================================================================
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }

# ============================================================================
# TESTING
# ============================================================================
[dev-dependencies]
mockall = { workspace = true }
fake = { workspace = true }
rstest = { workspace = true }

# ============================================================================
# FEATURES
# ============================================================================
[features]
default = []

# ============================================================================
# NOTES
# ============================================================================
# - NO PostgreSQL (stateless gateway)
# - WebSocket connections for real-time events
# - Proxies HTTP requests to backend services
# - Rate limiting per user
# - Subscribes to all NATS events and broadcasts to clients
# - Connection state in Redis
