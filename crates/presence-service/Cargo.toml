# Presence Service - Cargo.toml
# Handles online/offline status and typing indicators (Redis-only)

[package]
name = "presence-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "presence-service"
path = "src/main.rs"

[dependencies]
# ============================================================================
# LOCAL DEPENDENCIES
# ============================================================================
common = { path = "../common" }

# ============================================================================
# WEB FRAMEWORK
# ============================================================================
axum = { workspace = true }
axum-extra = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# ============================================================================
# SERIALIZATION
# ============================================================================
serde = { workspace = true }
serde_json = { workspace = true }

# ============================================================================
# ERROR HANDLING
# ============================================================================
thiserror = { workspace = true }
anyhow = { workspace = true }

# ============================================================================
# CONFIGURATION
# ============================================================================
config = { workspace = true }
dotenvy = { workspace = true }

# ============================================================================
# LOGGING & OBSERVABILITY
# ============================================================================
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# ============================================================================
# METRICS
# ============================================================================
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# ============================================================================
# TIME & UUID
# ============================================================================
uuid = { workspace = true }
chrono = { workspace = true }

# ============================================================================
# REDIS (PRIMARY storage - presence is fully Redis-based)
# ============================================================================
redis = { workspace = true }

# ============================================================================
# NATS (for publishing presence events)
# ============================================================================
async-nats = { workspace = true }

# ============================================================================
# API DOCUMENTATION
# ============================================================================
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }

# ============================================================================
# TESTING
# ============================================================================
[dev-dependencies]
mockall = { workspace = true }
fake = { workspace = true }
rstest = { workspace = true }

# ============================================================================
# FEATURES
# ============================================================================
[features]
default = []

# ============================================================================
# NOTES
# ============================================================================
# - NO PostgreSQL dependency (fully Redis-based)
# - Fast TTL-based presence tracking
# - Typing indicators with auto-expiration
# - Heartbeat system for online status
# - All state stored in Redis with TTL
