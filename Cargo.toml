[workspace]
resolver = "2"
members = [
    "services/common",
    "services/common/common-config",
    "services/auth-service",
    "services/user-service",
    "services/channel-service",
    "services/chat-service",
    "services/voice-service",
    "services/presence-service",
    "services/gateway-service",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Bulut Can Gocer <gocerbulutcan@gmail.com>"]
license = "MIT"
repository = "https://github.com/bulutcan99/hermes"

# ============================================================================
# WORKSPACE LINT POLICY (GLOBAL)
# ============================================================================

[workspace.lints.rust]
unsafe_code = "forbid"
unused = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"

# ----------------------------------------------------------------------------
# PANIC & ERROR POLICY (PRODUCTION BACKEND)
# ----------------------------------------------------------------------------
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"

# ----------------------------------------------------------------------------
# SQLX / MACRO HEAVY BACKEND REAL-WORLD SUPPRESSIONS
# ----------------------------------------------------------------------------
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
type_complexity = "allow"
needless_pass_by_value = "allow"
struct_excessive_bools = "allow"

[workspace.dependencies]
# ============================================================================
# WEB FRAMEWORK & HTTP
# ============================================================================
axum = { version = "0.7.6", features = ["macros", "multipart"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tokio = { version = "1.38", features = ["full"] }
tower = { version = "0.4", features = ["limit", "buffer", "timeout", "util"] }
tower-http = { version = "0.5.2", features = [
    "cors",
    "trace",
    "compression-gzip",
    "request-id",
] }

# ============================================================================
# GRPC (Inter-service Communication)
# ============================================================================
tonic = { version = "0.11", features = ["transport"] }
tonic-build = "0.11"
prost = "0.12"
prost-types = "0.12"

# ============================================================================
# DATABASE (PostgreSQL)
# ============================================================================
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    "json",
    "tls-rustls",
    "macros",
] }

# ============================================================================
# SERIALIZATION & VALIDATION
# ============================================================================
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
validator = { version = "0.19", features = ["derive"] }

# ============================================================================
# ERROR HANDLING
# ============================================================================
thiserror = "1.0"
anyhow = "1.0"

# ============================================================================
# ASYNC & CONCURRENCY
# ============================================================================
async-trait = "0.1"
futures = "0.3"

# ============================================================================
# AUTHENTICATION & SECURITY
# ============================================================================
jsonwebtoken = "9.3"
argon2 = "0.5"
sha2 = "0.10.9"
rand = "0.8"

# ============================================================================
# CONFIGURATION & ENVIRONMENT
# ============================================================================
config = "0.14"
figment = { version = "0.10", features = ["env"] }
dotenvy = "0.15"

# ============================================================================
# LOGGING & OBSERVABILITY
# ============================================================================
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# ============================================================================
# METRICS (Prometheus)
# ============================================================================
metrics = "0.22"
metrics-exporter-prometheus = { version = "0.15", default-features = false }

# ============================================================================
# TIME & UUID
# ============================================================================
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }

# ============================================================================
# HTTP CLIENT (for inter-service communication)
# ============================================================================
reqwest = { version = "0.12", features = [
    "json",
    "rustls-tls",
], default-features = false }

# ============================================================================
# REDIS (Caching & Presence)
# ============================================================================
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# ============================================================================
# RATE LIMITING
# ============================================================================
governor = "0.6"

# ============================================================================
# MESSAGE QUEUE (NATS for event-driven architecture)
# ============================================================================
async-nats = "0.33"

# ============================================================================
# WEBSOCKET (for Gateway Service)
# ============================================================================
tokio-tungstenite = "0.21"

# ============================================================================
# API DOCUMENTATION (Swagger/OpenAPI)
# ============================================================================
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }

# ============================================================================
# UTILITIES
# ============================================================================
once_cell = "1.19"
regex = "1.12.3"

# ============================================================================
# TESTING
# ============================================================================
testcontainers = "0.26"
testcontainers-modules = { version = "0.14", features = ["postgres"] }
mockall = "0.13"
fake = { version = "2.9", features = ["derive", "chrono"] }
rstest = "0.21"
http-body-util = "0.1"
tokio-stream = "0.1"

# ============================================================================
# PROFILE CONFIGURATIONS
# ============================================================================
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1

# ============================================================================
# NOTES
# ============================================================================
# - All services inherit dependencies from workspace
# - Each service Cargo.toml uses: dependency = { workspace = true }
# - Common crate provides shared utilities
# - NATS for event streaming between services
# - Redis for caching and presence tracking
# - PostgreSQL for persistent storage
# - GRPC for communication services each other

