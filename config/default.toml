# Default configuration - shared across all services

[service]
name = "hermes-service"
version = "0.1.0"
host = "0.0.0.0"
port = 8080  # Default port for Gateway
max_request_size = 10485760  # 10MB
request_timeout_secs = 30
graceful_shutdown_timeout_secs = 30

[database]
max_connections = 10
min_connections = 2
acquire_timeout_secs = 30
idle_timeout_secs = 600

[redis]
pool_size = 10

[nats]
max_reconnects = 10

[jwt]
access_secret = "dev-access-secret-change-in-production"
refresh_secret = "dev-refresh-secret-change-in-production"
expiration_hours = 24
refresh_expiration_days = 30

[logging]
level = "info"
format = "json"
