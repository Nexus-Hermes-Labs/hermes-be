# Gateway Service Configuration
# This file is only loaded when SERVICE_NAME=gateway-service

# Service URLs - These can be overridden via environment variables
[gateway]
auth_service_url = "http://localhost:8081"
user_service_url = "http://localhost:8082"
channel_service_url = "http://localhost:8083"
chat_service_url = "http://localhost:8084"
voice_service_url = "http://localhost:8085"
stream_service_url = "http://localhost:8086"
presence_service_url = "http://localhost:8087"

# Gateway Behavior
service_timeout_secs = 30
max_retries = 3
retry_delay_ms = 100

# Circuit Breaker
circuit_breaker_threshold = 5
circuit_breaker_timeout_secs = 60
