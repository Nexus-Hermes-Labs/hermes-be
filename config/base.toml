[service]
version = "1.0.0"
host = "0.0.0.0"
environment = "development"
allowed_origins = ["http://localhost", "http://localhost:3001"]
max_request_size = 10485760
request_timeout_secs = 30
graceful_shutdown_timeout_secs = 30

[database]
host = "127.0.0.1"
port = 5432
username = "hermes"
password = "hermes"
database = "hermes"
max_connections = 10
min_connections = 2
acquire_timeout = "30s"
idle_timeout = "10m"
max_lifetime = "30m"

[redis]
host = "127.0.0.1"
port = 6379
password = "redis_dev_password"
database = 0
max_connections = 10

[nats]
servers = "127.0.0.1:4222"
max_reconnect_attempts = 10

[smtp]
host = "127.0.0.1"
port = 1025
from_address = "no-reply@hermes.rs"
use_tls = false

[logging]
level = "info"
format = "pretty"

[grpc_endpoints]
auth_service = "http://127.0.0.1:50051"
user_service = "http://127.0.0.1:50052"
guild_service = "http://127.0.0.1:50056"
channel_service = "http://127.0.0.1:50053"
